<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>

        body{
            font-family: Arial, sans-serif;
            margin:0;
            background:#f4f4f4;
        }

        nav{
            background:#2c3e50;
            color:white;
            padding:15px;
        }

        .container{
            width:80%;
            margin:auto;
            padding:20px;
        }

        footer{
            background:#2c3e50;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:30px;
        }

    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

       <a class="navbar-brand" href="{{ url_for('home.home') }}">Student Management</a>

    <div class="navbar-nav ms-auto">

        <a class="nav-link" href="{{ url_for('home.home') }}">Home</a>

        <a class="nav-link" href="{{ url_for('student.students') }}">Students</a>

        <a class="nav-link" href="{{ url_for('student.add_student') }}">Add Student</a>

    </div>

    </div>
</nav>

<div class="container mt-3">

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                    </button>

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

</div>

{% block content %}

{% endblock %}

</div>

<footer class="bg-dark text-white text-center py-3 mt-5">

Copyright © 2026 Student Management System

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
