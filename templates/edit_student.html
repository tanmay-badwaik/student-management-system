{% extends "base.html" %}

{% block title %}
Edit Student
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Edit Student</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Name</label>

            <input
                type="text"
                class="form-control"
                name="name"
                value="{{ student.name }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>

            <input
                type="email"
                class="form-control"
                name="email"
                value="{{ student.email }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Course</label>

            <input
                type="text"
                class="form-control"
                name="course"
                value="{{ student.course }}"
                required
            >
        </div>

        <button class="btn btn-success">
            Update Student
        </button>

        <a href="{{ url_for('student.students') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
