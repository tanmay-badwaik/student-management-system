{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<h2>Add Student</h2>

<form method="POST">

    <div class="mb-3">
        <label>Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Course</label>
        <input type="text" name="course" class="form-control" required>
    </div>

    <button class="btn btn-primary">
        Save Student
    </button>

</form>
{% endblock %}
